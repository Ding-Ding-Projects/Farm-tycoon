<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Tycoon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚜</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The farm world: full-window canvas. All menus/HUD are DOM below. -->
  <canvas id="world"></canvas>

  <!-- HUD top bar -->
  <div class="hud-top">
    <div class="level-badge" id="level-badge">
      <svg class="progress-ring" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <span id="level-number">1</span>
    </div>
    <div class="hud-counters">
      <div class="pill-counter" id="coins-pill" title="Coins"><span class="pill-icon">🪙</span><span id="coins-value">0</span></div>
      <div class="pill-counter" id="diamonds-pill" title="Diamonds"><span class="pill-icon">💎</span><span id="diamonds-value">0</span></div>
      <div class="pill-counter" id="silo-pill" title="Silo"><span class="pill-icon">🌾</span><span id="silo-value">0/50</span></div>
      <div class="pill-counter" id="barn-pill" title="Barn"><span class="pill-icon">📦</span><span id="barn-value">0/50</span></div>
    </div>
  </div>

  <!-- Event banner (weekend event / mini-event / Farm Fair; hidden when none active) -->
  <div class="event-banner" id="event-banner" hidden>
    <span class="event-icon" id="event-icon">🎪</span>
    <div class="event-info">
      <strong id="event-name"></strong>
      <div class="event-progress"><div class="event-progress-fill" id="event-progress-fill"></div>
        <span class="event-tier-pin" data-tier="bronze"></span>
        <span class="event-tier-pin" data-tier="silver"></span>
        <span class="event-tier-pin" data-tier="gold"></span>
      </div>
    </div>
    <span class="event-timer" id="event-timer"></span>
  </div>

  <!-- Bottom dock -->
  <!-- Systems open by clicking their structure in the world; the dock keeps only what has
       no physical place: decorate mode, achievements, co-op/regatta, and settings. -->
  <nav class="dock" id="dock">
    <button class="dock-btn" data-panel="decorate" title="Decorate">🎨</button>
    <button class="dock-btn" data-panel="achievements" title="Achievements">⭐</button>
    <button class="dock-btn" data-panel="coop" title="Co-op &amp; Regatta" hidden>🤝</button>
    <button class="dock-btn" data-panel="settings" title="Settings">⚙️</button>
  </nav>

  <!-- Sliding sheet panels (ui.js fills content per panel) -->
  <div class="sheet-panel" id="sheet" hidden>
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <div class="sheet-content" id="sheet-content"></div>
  </div>

  <!-- Radial context menu, toasts, popups -->
  <div class="radial-menu" id="radial" hidden></div>
  <div class="toast-stack" id="toasts"></div>
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div class="tutorial-overlay" id="tutorial" hidden>
    <div class="tutorial-spotlight" id="tutorial-spotlight"></div>
    <div class="tutorial-arrow" id="tutorial-arrow">👇</div>
    <div class="tutorial-bubble" id="tutorial-bubble"></div>
  </div>

  <p id="boot-status" class="boot-status"></p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
